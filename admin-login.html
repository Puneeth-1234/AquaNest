<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Gateway &bull; AquaNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 20%, #0d2238 0%, #071524 60%, #030a12 100%);
      color: var(--white);
      margin: 0;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      z-index: 2;
    }

    .admin-login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(14, 28, 48, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 210, 255, 0.22);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 210, 255, 0.12);
      animation: floatIn 0.5s ease-out;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon-wrap {
      width: 60px;
      height: 60px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(0, 119, 182, 0.35));
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan-400);
      box-shadow: 0 8px 24px rgba(0, 210, 255, 0.25);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
      background: linear-gradient(135deg, #ffffff 30%, var(--cyan-400) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: var(--slate-400);
      margin: 0;
    }

    .admin-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: var(--cyan-400);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--slate-300);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--slate-400);
      pointer-events: none;
    }

    .login-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      background: rgba(7, 18, 33, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: var(--white);
      font-size: 0.95rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--cyan-400);
      box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.2);
      background: rgba(7, 18, 33, 0.95);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 1rem;
      background: transparent;
      border: none;
      color: var(--slate-400);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0.25rem;
    }

    .toggle-pwd-btn:hover {
      color: var(--cyan-400);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--slate-400);
      margin-top: -0.25rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .login-submit-btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--cyan-500), var(--blue-600));
      color: #030e1a;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 8px 24px rgba(0, 210, 255, 0.35);
      transition: all 0.2s ease;
    }

    .login-submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 210, 255, 0.45);
      filter: brightness(1.1);
    }

    .login-submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .alert-banner {
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.84rem;
      display: none;
      align-items: center;
      gap: 0.6rem;
      line-height: 1.4;
    }

    .alert-banner.error {
      display: flex;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .alert-banner.success {
      display: flex;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .login-footer {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.82rem;
      color: var(--slate-400);
    }

    .back-store-link {
      color: var(--cyan-400);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-store-link:hover {
      color: var(--white);
    }

    .credentials-hint {
      background: rgba(0, 210, 255, 0.05);
      border: 1px dashed rgba(0, 210, 255, 0.25);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.78rem;
      color: var(--slate-300);
      width: 100%;
      text-align: center;
    }

    .credentials-hint code {
      color: var(--cyan-300);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Ambient Aquatic Glow Bubbles -->
  <div class="bubble-bg" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden; opacity: 0.4;"></div>

  <main class="login-container">
    <div class="admin-login-card">
      <div class="brand-header">
        <div class="brand-icon-wrap">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="brand-title">AquaNest Admin</h1>
        <p class="brand-subtitle">Management Console &bull; Security Gateway</p>
        <span class="admin-badge">Admin Access Only</span>
      </div>

      <!-- Alert Message Box -->
      <div id="login-alert" class="alert-banner error" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="alert-text">Invalid email or password</span>
      </div>

      <form id="admin-login-form" class="login-form" style="margin-top: 1rem;">
        <div class="form-group">
          <label class="form-label" for="admin-email">Administrator Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="admin-email" class="login-input" placeholder="admin@aquanest.com" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">Secure Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="admin-password" class="login-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="toggle-pwd-btn" class="toggle-pwd-btn" title="Toggle visibility" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember credentials</span>
          </label>
          <span style="color: var(--slate-400);">Stage 5 Protected</span>
        </div>

        <button type="submit" id="login-submit-btn" class="login-submit-btn">
          <span>Authorize Access</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

        <div class="credentials-hint">
          Standard Admin: <code>admin@aquanest.com</code> &bull; Pass: <code>Admin@123456</code>
        </div>
      </form>

      <div class="login-footer">
        <a href="index.html" class="back-store-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Return to Customer Storefront
        </a>
        <span>AquaNest Aquatic Technologies &bull; Internal Control</span>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('admin-login-form');
      const emailInput = document.getElementById('admin-email');
      const passwordInput = document.getElementById('admin-password');
      const rememberCheckbox = document.getElementById('remember-me');
      const alertBox = document.getElementById('login-alert');
      const alertText = document.getElementById('alert-text');
      const submitBtn = document.getElementById('login-submit-btn');
      const togglePwdBtn = document.getElementById('toggle-pwd-btn');

      // Password toggle
      togglePwdBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
      });

      // Show alert helper
      function showAlert(msg, isError = true) {
        alertText.textContent = msg;
        alertBox.className = `alert-banner ${isError ? 'error' : 'success'}`;
        alertBox.style.display = 'flex';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      // If already logged in as admin, verify and redirect to admin.html
      const existingToken = AquaNestAPI.getAdminToken();
      const existingAdmin = AquaNestAPI.getAdminUser();
      if (existingToken && existingAdmin && existingAdmin.role === 'admin') {
        window.location.href = 'admin.html';
        return;
      }

      // Check query parameter error (e.g. ?denied=1)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('denied') === '1') {
        showAlert('Access Denied: You must sign in with an Administrator account.', true);
      } else if (urlParams.get('expired') === '1') {
        showAlert('Your session has expired. Please log in again.', true);
      }

      // Handle form submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const remember = rememberCheckbox.checked;

        if (!email || !password) {
          showAlert('Please provide both email and password.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <div class="api-spinner-sm" style="margin-right: 0.5rem;"></div>
          <span>Verifying credentials...</span>
        `;

        try {
          const res = await AquaNestAPI.adminLogin({ email, password }, remember);
          if (res.success) {
            showAlert('Authorization successful! Redirecting to Dashboard...', false);
            setTimeout(() => {
              window.location.href = 'admin.html';
            }, 600);
          }
        } catch (err) {
          console.warn('Admin login failed:', err.message);
          showAlert(err.message || 'Unable to connect to AquaNest server. Please try again.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
            <span>Authorize Access</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          `;
        }
      });
    });
  </script>
</body>
</html>
